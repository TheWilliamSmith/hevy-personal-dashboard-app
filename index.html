<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hevy Personal Dashboard</title>
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = (JSON.parse(localStorage.getItem('hevy-dashboard.preferences') || 'null') || {}).theme || 'system';
        } catch (error) {
          theme = 'system';
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
